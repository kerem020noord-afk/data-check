name: Gold XAUUSD analyse

on:
  schedule:
    # Draait elke 5 minuten. GitHub kan dit onder drukke omstandigheden een
    # paar minuten vertragen; dat is een limiet van GitHub Actions zelf.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # laat je de workflow ook handmatig starten vanaf de Actions-tab

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nodig om heartbeat_state.txt na elke run terug te committen
    steps:
      - name: Repository uitchecken
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Analyse uitvoeren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gold_analysis.py --once

      - name: Status opslaan (heartbeat + waarschuwingen)
        run: |
          if [ -n "$(git status --porcelain heartbeat_state.txt warning_state.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add heartbeat_state.txt warning_state.txt
            git commit -m "Status bijwerken (heartbeat/waarschuwingen) [skip ci]"
            git push
          else
            echo "Geen wijziging in status, niets te committen."
          fi
